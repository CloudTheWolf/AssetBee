# Traefik dynamic configuration (middlewares, optional TLS options)

http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customFrameOptionsValue: "SAMEORIGIN"
    compress:
      compress: {}

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
