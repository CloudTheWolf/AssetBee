# Production Docker Compose — Traefik + FrankenPHP/Octane + queue + scheduler
#
# Usage:
#   cp .env.production.example .env.production
#   # set APP_KEY, DOMAIN, ACME_EMAIL, DB_PASSWORD, DB_ROOT_PASSWORD, APP_URL
#   docker compose -f compose.production.yaml --env-file .env.production up -d --build
#
# Local Sail continues to use compose.yaml.

name: assetbee

x-app: &app
  image: assetbee-app:${APP_VERSION:-latest}
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  restart: unless-stopped
  env_file:
    - path: .env.production
      required: false
  networks:
    - internal
  volumes:
    - app_storage:/app/storage/app
    - app_logs:/app/storage/logs

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mariadb
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-assetbee}
  DB_USERNAME: ${DB_USERNAME:-assetbee}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  SESSION_SECURE_COOKIE: "true"
  TRUSTED_PROXIES: "*"
  OCTANE_SERVER: frankenphp
  OCTANE_HTTPS: "true"

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=assetbee_proxy
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
      - --ping=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/production/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    <<: *app
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      traefik:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=assetbee_proxy
      - traefik.http.routers.assetbee.rule=Host(`${DOMAIN:?DOMAIN is required}`)
      - traefik.http.routers.assetbee.entrypoints=websecure
      - traefik.http.routers.assetbee.tls=true
      - traefik.http.routers.assetbee.tls.certresolver=letsencrypt
      - traefik.http.routers.assetbee.middlewares=security-headers@file,compress@file
      - traefik.http.services.assetbee.loadbalancer.server.port=8000
      - traefik.http.services.assetbee.loadbalancer.healthcheck.path=/up
      - traefik.http.services.assetbee.loadbalancer.healthcheck.interval=30s
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  queue:
    <<: *app
    environment:
      <<: *app-env
      CONTAINER_ROLE: queue
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
      mariadb:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-assetbee}
      MYSQL_USER: ${DB_USERNAME:-assetbee}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  proxy:
    name: assetbee_proxy
    driver: bridge
  internal:
    name: assetbee_internal
    driver: bridge
    internal: true

volumes:
  traefik_letsencrypt:
  mariadb_data:
  redis_data:
  app_storage:
  app_logs:
