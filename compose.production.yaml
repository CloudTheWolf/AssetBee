# Production Docker Compose — Includes Traefik Labels
#
# Base:
#   docker compose --env-file .env.production up -d --build
#
# Include MariaDB:
#   docker compose --env-file .env.production --profile with-sql up -d --build
#
# Include Redis:
#   docker compose --env-file .env.production --profile with-redis up -d --build
#
# Include both:
#   docker compose --env-file .env.production \
#     --profile with-sql \
#     --profile with-redis \
#     up -d --build

name: assetbee

x-app: &app
  image: cloudthewolf/assetbee-site:${APP_VERSION:-latest}

  restart: unless-stopped
  networks:
    - traefik_default
  env_file:
    - path: .env
      required: false

  volumes:
    - app_storage:/app/storage/app
    - app_logs:/app/storage/logs


x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"

  LOG_CHANNEL: stderr

  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST:-mariadb}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-assetbee}
  DB_USERNAME: ${DB_USERNAME:-assetbee}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  CACHE_STORE: ${CACHE_STORE:-redis}
  SESSION_DRIVER: ${SESSION_DRIVER:-redis}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}

  SESSION_SECURE_COOKIE: "true"
  TRUSTED_PROXIES: "*"

  OCTANE_SERVER: frankenphp
  OCTANE_HTTPS: "true"


services:

  # ============================================================
  # Application
  # ============================================================

  app:
    <<: *app

    environment:
      <<: *app-env
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}

    depends_on:
      mariadb:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

    networks:
      - traefik_default

    labels:
      traefik.enable: "true"
      traefik.http.routers.assetbee.rule: Host(`${DOMAIN:?DOMAIN is required}`)
      traefik.http.routers.assetbee-site.entrypoints: websecure
      traefik.http.routers.assetbee-site.tls.certresolver: myresolver
      traefik.http.services.assetbee-site.loadbalancer.server.port: "8000"
      traefik.http.middlewares.assetbee-site-cors.headers.accessControlAllowOriginList: "*"
      traefik.http.middlewares.assetbee-site-cors.headers.accessControlAllowHeaders: "Origin, X-Requested-With, Content-Type, Accept, Authorization"
      traefik.http.middlewares.assetbee-site-cors.headers.accessControlExposeHeaders: "Content-Length, Content-Range"
      traefik.http.middlewares.assetbee-site-cors.headers.accesscontrolallowmethods: "GET,OPTIONS,PUT,POST,DELETE,HEAD"
      traefik.http.routers.assetbee-site.middlewares: "assetbee-site-cors,add-headers"
      traefik.http.middlewares.add-headers.headers.customrequestheaders.X-Forwarded-For: "{clientIP}"
      traefik.http.middlewares.add-headers.headers.customrequestheaders.X-Real-IP: "{clientIP}"

    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s


  # ============================================================
  # Queue Worker
  # ============================================================

  queue:
    <<: *app

    environment:
      <<: *app-env
      CONTAINER_ROLE: queue
      RUN_MIGRATIONS: "false"

    depends_on:
      app:
        condition: service_healthy
      mariadb:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false


  # ============================================================
  # Scheduler
  # ============================================================

  scheduler:
    <<: *app

    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
      RUN_MIGRATIONS: "false"

    depends_on:
      app:
        condition: service_healthy
      mariadb:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false


  # ============================================================
  # Redis
  #
  # Enable with:
  #   --profile with-redis
  # ============================================================

  redis:
    image: redis:7-alpine

    profiles:
      - with-redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru

    volumes:
      - redis_data:/data

    networks:
      - traefik_default

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # MariaDB
  #
  # Enable with:
  #   --profile with-sql
  # ============================================================

  mariadb:
    image: mariadb:11

    profiles:
      - with-sql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-assetbee}
      MYSQL_USER: ${DB_USERNAME:-assetbee}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - traefik_default

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


# ==============================================================
# Networks
# ==============================================================

networks:

  # Existing Traefik network
  traefik_default:
    external: true
    name: traefik_default

# ==============================================================
# Volumes
# ==============================================================

volumes:
  redis_data:
  mariadb_data:
  app_storage:
  app_logs:

